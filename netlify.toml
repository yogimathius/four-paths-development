[build]
  # Clear Astro's content cache: it keeps rendered Markdown, so site.config changes
  # (email, name) would otherwise not reach policy and support pages.
  command = "rm -rf .astro node_modules/.astro && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'self' https://buttondown.com; frame-ancestors 'none'; base-uri 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sadhana was Pillars. Old addresses (store listings, bookmarks, search) keep working.
[[redirects]]
  from = "/apps/pillars"
  to = "/apps/sadhana"
  status = 301
  force = true

[[redirects]]
  from = "/apps/pillars/*"
  to = "/apps/sadhana/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/work/pillars"
  to = "/work/sadhana"
  status = 301
  force = true

[[redirects]]
  from = "/og/pillars.png"
  to = "/og/sadhana.png"
  status = 301
  force = true

[[redirects]]
  from = "/journal/introducing-pillars"
  to = "/journal/introducing-sadhana"
  status = 301
  force = true
